services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: mafit-app
    restart: unless-stopped
    working_dir: /var/www/mafit
    volumes:
      - ./:/var/www/mafit
    environment:
      APP_ENV: production
      APP_DEBUG: false
      FILESYSTEM_DISK: google
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www/mafit
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
